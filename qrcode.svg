<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d124d" />
      <stop offset="100%" stop-color="#0e051a" />
    </radialGradient>
    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3e6c" />
      <stop offset="50%" stop-color="#ff7b00" />
      <stop offset="100%" stop-color="#ffeb3b" />
    </linearGradient>
  </defs>

  <!-- Outer Ring (WeChat Mini-program style outer border) -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="3" />
  
  <!-- Outer Dotted Ring -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4, 4" />
  
  <!-- Mini Program Code Rays (Abstract stylized rays to simulate WeChat Mini Program Code) -->
  <g stroke="url(#accentGrad)" stroke-linecap="round" stroke-width="4">
    <!-- Inner rings of rays -->
    <!-- Angle 0 -->
    <line x1="100" y1="35" x2="100" y2="48" />
    <line x1="100" y1="152" x2="100" y2="165" />
    <line x1="35" y1="100" x2="48" y2="100" />
    <line x1="152" y1="100" x2="165" y2="100" />

    <!-- Angle 45 -->
    <line x1="54" y1="54" x2="63" y2="63" />
    <line x1="137" y1="137" x2="146" y2="146" />
    <line x1="137" y1="54" x2="128" y2="63" />
    <line x1="54" y1="137" x2="63" y2="128" />

    <!-- Additional WeChat-like code nodes -->
    <circle cx="100" cy="22" r="3" fill="#ffeb3b" />
    <circle cx="100" cy="178" r="3" fill="#ff3e6c" />
    <circle cx="22" cy="100" r="3" fill="#ff7b00" />
    <circle cx="178" cy="100" r="3" fill="#ff3e6c" />

    <!-- Stylized spokes -->
    <path d="M 68,68 A 45,45 0 0,1 132,68" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" />
    <path d="M 68,132 A 45,45 0 0,0 132,132" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" />

    <line x1="80" y1="45" x2="84" y2="52" />
    <line x1="120" y1="45" x2="116" y2="52" />
    <line x1="80" y1="155" x2="84" y2="148" />
    <line x1="120" y1="155" x2="116" y2="148" />
    
    <line x1="45" y1="80" x2="52" y2="84" />
    <line x1="45" y1="120" x2="52" y2="116" />
    <line x1="155" y1="80" x2="148" y2="84" />
    <line x1="155" y1="120" x2="148" y2="116" />
  </g>

  <!-- Inner Center Core Ring -->
  <circle cx="100" cy="100" r="32" fill="#ff3e6c" />
  <circle cx="100" cy="100" r="30" fill="#000000" />
  
  <!-- Center Logo Placeholder: Crown / POP MART Style -->
  <g transform="translate(85, 83) scale(0.6)">
    <!-- Crown icon -->
    <path d="M5,25 L10,10 L22,20 L33,10 L38,25 Z" fill="url(#accentGrad)" />
    <circle cx="5" cy="8" r="2" fill="#ffeb3b" />
    <circle cx="22" cy="7" r="2" fill="#ffeb3b" />
    <circle cx="38" cy="8" r="2" fill="#ffeb3b" />
    <rect x="5" y="27" width="33" height="4" rx="1" fill="#ffffff" />
    <!-- Text PM -->
    <text x="10" y="44" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="1">POPMART</text>
  </g>
</svg>
